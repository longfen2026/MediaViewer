<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>视图浏览器</title>
  <link rel="stylesheet" href="/mobile/style.css?v=20260819l">
</head>
<body>
  <div id="m-login" class="m-login">
    <div class="m-login-box">
      <h1>视图浏览器</h1>
      <form id="m-login-form">
        <input type="text" id="m-username" placeholder="用户名" autocomplete="username" required>
        <input type="password" id="m-password" placeholder="密码" autocomplete="current-password" required>
        <div id="m-login-error" class="m-error hidden"></div>
        <button type="submit" class="m-btn-primary">登录</button>
      </form>
    </div>
  </div>

  <div id="m-main" class="hidden">
    <header class="m-titlebar">
      <span class="m-brand">视图浏览器<span class="m-version-badge"></span></span>
      <button id="m-fav-btn" class="m-title-btn" title="收藏"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21C12 21 4 14.6 4 8.8C4 6 6 4 8.7 4c1.3 0 2.5.6 3.3 1.6.8-1 2-1.6 3.3-1.6C18 4 20 6 20 8.8c0 5.8-8 12.2-8 12.2z"/></svg></button>
      <span id="m-user" class="m-user-name"></span>
      <button id="m-logout-btn" class="m-title-btn">退出</button>
    </header>

    <div class="m-pathbar">
      <button id="m-menu-btn" class="m-menu-btn"><svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
      <span id="m-path-display" class="m-path-text">/</span>
    </div>

    <div id="m-sortbar" class="m-sortbar hidden">
      <span class="m-sort-label">排序</span>
      <select id="m-sort-by">
        <option value="time" selected>时间</option>
        <option value="name">名称</option>
      </select>
      <select id="m-sort-order">
        <option value="desc" selected>倒序</option>
        <option value="asc">正序</option>
      </select>
      <select id="m-time-group" class="m-time-group hidden">
        <option value="day">按天</option>
        <option value="month" selected>按月</option>
        <option value="year">按年</option>
      </select>
    </div>

    <div id="m-content" class="m-content">
      <div id="m-folders" class="m-folder-grid"></div>
      <div id="m-media" class="m-masonry"></div>
      <div id="m-pagination" class="m-pagination hidden">
        <button id="m-page-prev" class="m-page-btn">上一页</button>
        <span id="m-page-info" class="m-page-info">1/1</span>
        <button id="m-page-next" class="m-page-btn">下一页</button>
      </div>
      <div id="m-empty" class="m-empty hidden">此目录为空</div>
      <div id="m-loading" class="m-loading hidden">加载中...</div>
    </div>
  </div>

  <div id="m-drawer-bg" class="m-drawer-bg hidden"></div>
  <div id="m-drawer" class="m-drawer">
    <div class="m-drawer-header">目录</div>
    <div id="m-tree" class="m-tree"></div>
  </div>

  <div id="m-viewer" class="m-viewer hidden">
    <div class="m-viewer-body">
      <div id="m-viewer-spinner" class="m-viewer-spinner hidden"><div class="m-spinner-ring"></div></div>
      <img id="m-viewer-img" class="m-viewer-img" alt="">
      <video id="m-viewer-video" class="m-viewer-video hidden" controls playsinline preload="auto"></video>
    </div>
  </div>
  <div id="m-toast" class="m-toast hidden"></div>

  <script src="/mobile/app.js?v=20260819l"></script>
</body>
</html>
