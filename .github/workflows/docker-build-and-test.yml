name: Docker Build and Test

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME,,}" >> $GITHUB_ENV
          PKG=${IMAGE_NAME##*/}
          echo "PACKAGE_NAME=${PKG,,}" >> $GITHUB_ENV
        shell: bash

      - name: Delete old GHCR package versions
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/cleanup-ghcr.sh "$PACKAGE_NAME"
        shell: bash

      - name: Read version from file
        id: version
        run: |
          VERSION=$(cat version | tr -d '[:space:]')
          echo "IMAGE_TAG=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE_VERSION=v$VERSION" >> "$GITHUB_ENV"
          echo "Image version: $VERSION"
        shell: bash

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (amd64)
        run: docker buildx build --progress=plain --platform linux/amd64 -t gallery-manager:ci --load .

      - name: Prepare gallery dir
        run: mkdir -p gallery

      - name: Run container
        run: |
          docker run -d --rm --platform linux/amd64 --name gallery-manager-test -p 8080:8080 \
            -v "$GITHUB_WORKSPACE/gallery":/gallery \
            -v gallery-data:/app/data \
            gallery-manager:ci

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -sS http://localhost:8080/api/ping >/dev/null 2>&1; then
              echo "server ready"; break
            fi
            sleep 1
          done

      - name: Show container logs
        run: docker logs --tail 200 gallery-manager-test || true

      - name: Ping endpoint
        run: curl -v http://localhost:8080/api/ping

      - name: Stop container
        if: always()
        run: |
          docker stop gallery-manager-test || true

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:ci
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:${{ env.IMAGE_TAG }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Push version tag
        if: github.ref == 'refs/heads/master'
        run: |
          TAG=${{ env.IMAGE_VERSION }}
          git tag "$TAG" 2>/dev/null && echo "Created tag $TAG" || echo "Tag $TAG already exists locally"
          if git push origin "$TAG" 2>/dev/null; then
            echo "Pushed tag $TAG"
          else
            echo "Tag $TAG already exists on remote, skipping push"
          fi
