name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install libarchive-tools (bsdtar)
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - run: npm ci

      - name: Check version consistency
        run: |
          npm run sync-version
          git diff --exit-code package.json \
            || { echo '::error::package.json 版本与 version 文件不一致，请运行 npm run sync-version'; exit 1; }

      - run: npm test

      - name: Build image
        run: docker build -t gallery-manager:test .
